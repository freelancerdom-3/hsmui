<div class="cart-wrapper">
  @if (cartItems.length > 0) {
    @for (item of cartItems; track item.subCategoryId) {
      <div class="subcategory-card">
        <!-- Subcategory Image and Name -->
        <div style="display: flex; align-items: center; gap: 12px;">
          <img
            [src]="item.subCategoryImageName | imageurl | async"
            alt="{{ item.subCategoryName }}"
            width="40"
            height="40"
            style="border-radius: 8px;"
          />
          <h2 class="subcategory-name">{{ item.subCategoryName }}</h2>
        </div>

        <!-- Services -->
        <div class="services-list" style="margin-top: 12px;">
          @for (service of item.services; track service.serviceId) {
            <div class="service-card" style="padding-left: 16px;">
              <p>{{ service.serviceName }} × {{ service.quantity }}</p>
            </div>
          }
        </div>

        <!-- Buttons -->
        <div class="action-buttons" style="margin-top: 16px;">
          <button (click)="navigateToSubCategoryComponent(item.subCategoryId)">Add/Remove Services</button>
          <button (click)="checkout(item.subCategoryId)">Checkout</button>
        </div>
      </div>
    }
  } @else {
    <div style="text-align: center;">
      <svg width="50%" height="50%" viewBox="0 0 128 96" xmlns="http://www.w3.org/2000/svg">
        <!-- [SVG remains unchanged] -->
      </svg>
      <h4>Your cart is empty</h4>
      <p>Let's add some services</p>
    </div>

    <div style="text-align: center;">
      <button (click)="navigateToDashboard()" style="border: 1px solid black; background-color: white;">
        Explore other services
      </button>
    </div>
  }
</div>
