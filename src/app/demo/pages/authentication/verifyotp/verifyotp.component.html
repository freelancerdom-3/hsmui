<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-unlock auth-icon"></i>
        </div>
         <h3 class="mb-4">Enter OTP</h3> 

         <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Enter 6 digits OTP" maxlength="6" pattern="[0-9]*" [(ngModel)]="otp" />
        </div>

        <div class="input-group mb-4">

        </div> -->

            <label for="checkbox-fill-a1" class="cr">Save Details</label>
          </div> 
        </div> -->
        <button class="btn btn-primary mb-4" (click)="verifyOtp()">Verify OTP</button>
 
        <!-- <p class="mb-2 text-muted">
          Forgot password?
          <a [routerLink]="['/auth/reset-password']">Reset</a>
        </p> -->

           Didn't receive the code?
          <a href="#" (click)="resendOtp()">Resend OTP</a> </p>-->

      </div>
    </div>
  </div>
</div>
